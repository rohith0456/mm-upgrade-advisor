name: Validate Upgrade Advisor

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test upgrade paths and database prerequisites
        run: node tests/upgrade-path.test.js
      - name: Compile version updater
        run: python -m py_compile scripts/update_versions.py
